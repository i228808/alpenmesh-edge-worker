[package]
name = "alpenmesh-worker"
version = "0.1.0"
edition = "2024"

# Standalone workspace so this crate works when created inside another repo (e.g. Oxide itself).
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
oxide-framework-core = "0.1.0"
axum = { version = "0.8", features = ["multipart"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ort = { version = "2.0.0-rc.12", features = ["cuda", "tensorrt"] }
ndarray = "0.17"
image = "0.24"
nvml-wrapper = "0.10"
crossbeam-queue = "0.3"
zune-jpeg = "0.4"
fast_image_resize = "3.0"
rayon = "1.8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
csv = "1"
anyhow = "1"
